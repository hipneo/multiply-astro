<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F9F8F5"/>

  <!-- Faint editorial grid -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#1C1C1A" stroke-width="0.5" opacity="0.04"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#1C1C1A" stroke-width="0.5" opacity="0.05"/>
  <line x1="232" y1="72" x2="232" y2="558" stroke="#1C1C1A" stroke-width="0.5" opacity="0.03"/>
  <line x1="968" y1="72" x2="968" y2="558" stroke="#1C1C1A" stroke-width="0.5" opacity="0.03"/>

  <!-- ════════ LEFT: ORNATE BUT HOLLOW (outline only) ════════ -->
  <g>
    <!-- Outer frame -->
    <rect x="232" y="105" width="336" height="420" fill="none" stroke="#1C1C1A" stroke-width="1.5" opacity="0.32" rx="3"/>
    <!-- Inner double rule -->
    <rect x="245" y="118" width="310" height="394" fill="none" stroke="#1C1C1A" stroke-width="0.75" opacity="0.16" rx="2"/>

    <!-- Ornate corner brackets -->
    <path d="M258 131 L258 144 M258 131 L271 131" stroke="#9B2335" stroke-width="1.5" opacity="0.4" fill="none"/>
    <path d="M542 131 L542 144 M542 131 L529 131" stroke="#9B2335" stroke-width="1.5" opacity="0.4" fill="none"/>
    <path d="M258 499 L258 486 M258 499 L271 499" stroke="#9B2335" stroke-width="1.5" opacity="0.4" fill="none"/>
    <path d="M542 499 L542 486 M542 499 L529 499" stroke="#9B2335" stroke-width="1.5" opacity="0.4" fill="none"/>

    <!-- Decorative header rule with diamond -->
    <line x1="278" y1="168" x2="382" y2="168" stroke="#1C1C1A" stroke-width="0.75" opacity="0.2"/>
    <rect x="393" y="161" width="14" height="14" fill="none" stroke="#9B2335" stroke-width="1" opacity="0.45" transform="rotate(45 400 168)"/>
    <line x1="418" y1="168" x2="522" y2="168" stroke="#1C1C1A" stroke-width="0.75" opacity="0.2"/>

    <!-- Hollow title block (outline, unfilled) -->
    <rect x="330" y="192" width="140" height="13" fill="none" stroke="#9B2335" stroke-width="1" opacity="0.4" rx="1.5"/>

    <!-- Logo wall: twelve empty boxes -->
    <g stroke="#1C1C1A" stroke-width="0.75" opacity="0.13" fill="none">
      <rect x="272" y="232" width="76" height="38" rx="2"/>
      <rect x="362" y="232" width="76" height="38" rx="2"/>
      <rect x="452" y="232" width="76" height="38" rx="2"/>
      <rect x="272" y="282" width="76" height="38" rx="2"/>
      <rect x="362" y="282" width="76" height="38" rx="2"/>
      <rect x="452" y="282" width="76" height="38" rx="2"/>
      <rect x="272" y="332" width="76" height="38" rx="2"/>
      <rect x="362" y="332" width="76" height="38" rx="2"/>
      <rect x="452" y="332" width="76" height="38" rx="2"/>
    </g>

    <!-- Hollow bars, floating with no baseline -->
    <g fill="none" stroke="#1C1C1A" stroke-width="0.9" opacity="0.18">
      <rect x="288" y="452" width="34" height="30" rx="1.5"/>
      <rect x="338" y="436" width="34" height="46" rx="1.5"/>
      <rect x="388" y="418" width="34" height="64" rx="1.5"/>
      <rect x="438" y="400" width="34" height="82" rx="1.5"/>
    </g>
    <!-- no ground line beneath the bars -->
  </g>

  <!-- ════════ RIGHT: PLAIN BUT SOLID (filled) ════════ -->
  <g>
    <rect x="632" y="105" width="336" height="420" fill="#1C1C1A" opacity="0.9" rx="3"/>

    <!-- Title block -->
    <rect x="668" y="150" width="176" height="14" fill="#F9F8F5" opacity="0.9" rx="1.5"/>
    <rect x="668" y="176" width="104" height="8" fill="#F9F8F5" opacity="0.35" rx="1"/>
    <line x1="668" y1="204" x2="932" y2="204" stroke="#F9F8F5" stroke-width="0.75" opacity="0.22"/>

    <!-- Three solid case-study blocks, each with a crimson baseline tick -->
    <g>
      <rect x="668" y="226" width="4" height="26" fill="#9B2335"/>
      <rect x="682" y="228" width="150" height="9" fill="#F9F8F5" opacity="0.72" rx="1.5"/>
      <rect x="682" y="243" width="232" height="7" fill="#F9F8F5" opacity="0.3" rx="1"/>
    </g>
    <g>
      <rect x="668" y="272" width="4" height="26" fill="#9B2335"/>
      <rect x="682" y="274" width="188" height="9" fill="#F9F8F5" opacity="0.72" rx="1.5"/>
      <rect x="682" y="289" width="212" height="7" fill="#F9F8F5" opacity="0.3" rx="1"/>
    </g>
    <g>
      <rect x="668" y="318" width="4" height="26" fill="#9B2335"/>
      <rect x="682" y="320" width="164" height="9" fill="#F9F8F5" opacity="0.72" rx="1.5"/>
      <rect x="682" y="335" width="196" height="7" fill="#F9F8F5" opacity="0.3" rx="1"/>
    </g>

    <line x1="668" y1="372" x2="932" y2="372" stroke="#F9F8F5" stroke-width="0.75" opacity="0.18"/>

    <!-- Solid bars sitting on a real baseline -->
    <g fill="#F9F8F5" opacity="0.55">
      <rect x="688" y="452" width="34" height="30" rx="1.5"/>
      <rect x="738" y="436" width="34" height="46" rx="1.5"/>
      <rect x="788" y="418" width="34" height="64" rx="1.5"/>
      <rect x="838" y="400" width="34" height="82" rx="1.5"/>
    </g>
    <line x1="676" y1="482" x2="924" y2="482" stroke="#9B2335" stroke-width="1.75"/>
  </g>

  <!-- Verification mark on the solid document -->
  <circle cx="968" cy="525" r="30" fill="#F9F8F5"/>
  <circle cx="968" cy="525" r="24" fill="#9B2335"/>
  <path d="M957 525 L965 533 L980 517" fill="none" stroke="#F9F8F5" stroke-width="3.25" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
